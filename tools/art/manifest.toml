# Which source feeds which of our names (ART-00, design/10-art-direction.md; ART-03: the owner's
# mapping of 2026-09-29).
#
# Every sprite is made of the original Tiny Swords horizontal strips: square cells (cell = strip
# height), already transparent, at the pack's own size. An animation names its `file`, in the
# sprite's `root` folder of the pack.
#
# Frame rates stay in 12..15 (ADR-0003). Sprites face right; left is a mirror (design/10 Facing).

[settings]
cell_margin = 4        # transparent margin kept around the union of a sprite's frames
atlas_max = 2048       # page side, at most
atlas_padding = 2      # transparent gutter between packed frames
resample = "area"      # for a height in px, "area", "area-blend" or "nearest" (artpipe/scale.py); --resample=… overrides
palette_max = 64       # "area" snaps colours to the source's palette when it has at most this many
ui_edge = 0.15         # a stretched `[[ui]]` edge: at most this share of a row or column differs (artpipe/ui.py)

# The height of every sprite, one line each (ART-02; D-146 as corrected by the owner, 2026-09-29:
# the final sizes are the owner's eye on CLI-03a's sandbox, which scales per caste at display time).
# "native": the pack's own drawing, never resampled (factor 1, pixels untouched); every sprite is
# native since ART-03. A number stays possible: the visible height in px (idle frames, feet to top
# of head, what a hand holds left out: artpipe/scale.py) the sprite is resampled to. The native
# heights are measured by the build (its table) and by `tools/art/build.py --pack-heights`.
[height]
runt = "native"        # Thief
skirmisher = "native"  # Spear Goblin
slinger = "native"     # Torch Goblin
shaman = "native"      # Hex Shaman
hobgoblin = "native"   # Troll
vanguard = "native"    # Warrior
warden = "native"      # Archer
cleric = "native"      # Monk

# What the build checks on the result (AC-2 of ART-02): no basic goblin taller than the shortest
# profession, and `tallest` taller than every other sprite. A sprite of the pack keeps the pack's
# proportions and the owner scales it by eye in the sandbox, so a failure that involves only native
# sprites is a warning printed by the build; one that involves a resampled sprite is an error.
[order]
basic = ["runt", "skirmisher", "slinger"]
tallest = "hobgoblin"


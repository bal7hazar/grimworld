# Which source feeds which of our names (ART-00, design/10-art-direction.md).
#
# Two kinds of source:
#   kind = "generated"  the machine-generated goblin sheets: RGB on a magenta key, six columns by
#                       four rows, cut along their silhouettes. The folder is found in code (the
#                       one subfolder of "Enemy Pack" holding Animated/Raw), never named here.
#                       An animation names its `row` (0 Idle, 1 Walk, 2 Jump, 3 Attack).
#   kind = "strip"      the original Tiny Swords horizontal strips, square cells (cell = strip
#                       height), already transparent. An animation names its `file`.
#
# Frame rates stay in 12..15 (ADR-0003). Sprites face right; left is a mirror (design/10 Facing).

[settings]
key_tolerance = 48     # a pixel within this max-channel distance of the sheet's key is background
fringe_radius = 4      # px around the keyed background where anti-aliased edge pixels are unmixed
min_alpha = 0.06       # unmixed alpha below this is dropped (noise)
min_component = 6      # a detached speck smaller than this many px is dropped
cell_margin = 4        # transparent margin kept around the union of a sprite's frames
atlas_max = 2048       # page side, at most
atlas_padding = 2      # transparent gutter between packed frames
resample = "area"      # "area" (overlap average, alpha made binary) or "nearest"; see artpipe/scale.py

# Heights of the builds, in px (ART-02; D-146, provisional: the owner sets the final sizes by eye).
# Every sprite names its build; its visible height (idle, feet to top of head, what a hand holds
# left out: artpipe/scale.py) is resampled to its build's height. A sprite's own `height = N`
# overrides its build's. Changing a caste's height is one line: here, or its `height`.
[build]
small = 78             # basic goblins
medium = 94            # heroes, the shaman
large = 128            # the boss

# What the build checks on the result (AC-2): no basic goblin taller than the shortest profession,
# and `tallest` taller than every other sprite.
[order]
basic = ["runt", "skirmisher", "slinger"]
tallest = "hobgoblin"


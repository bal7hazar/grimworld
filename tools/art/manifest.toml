# ---------------------------------------------------------------- ground tiles (CLI-03e)
# Named cells of a tileset, 64 x 64 unless the entry's `cell` says another side: each becomes the sprite `<name>_<cell>`, role `tile`, packed
# untrimmed at native size, anchored at its top-left corner, its edges extruded into the gutter.
# `cells` = {cell = [column, row]} in the sheet. The grass is the first colour variant (proposed,
# the owner's eye): its flat ground's 3 x 3 autotile, the centre and the eight edges and corners.

[[tileset]]
name = "grass"
role = "tile"
file = "Terrain/Tileset/Tilemap_color1.png"
origin = "Tilemap color 1, flat ground"
cells = { nw = [0, 0], n = [1, 0], ne = [2, 0], w = [0, 1], c = [1, 1], e = [2, 1], sw = [0, 2], s = [1, 2], se = [2, 2] }

[[tileset]]
name = "water"
role = "tile"
file = "Terrain/Tileset/Water Background color.png"
origin = "Water background"
cells = { c = [0, 0] }

# The foam (CLI-03g2): the first still of the animated ring, one 192 x 192 cell; the zone's renderer
# centres it under every land hex that touches water, so its ring shows on the water.
[[tileset]]
name = "foam"
role = "tile"
file = "Terrain/Tileset/Water Foam.png"
origin = "Water foam, first frame"
cell = 192
cells = { c = [0, 0] }

# The foam's animation (CLI-03o): the sheet's 16 cells of 192 x 192 along its one row, every one
# whole and untrimmed, so each keeps the cell of frame 0 (`foam_c/still/00` stays as it is). Timing:
# the pack's own, 100 ms a frame in the source `Water Foam.aseprite`, so 10 fps, looping. The frames
# are `foam_c/loop/00` to `foam_c/loop/15`.
animations = { loop = { cell = "c", frames = 16, fps = 10, loop = true } }

# ---------------------------------------------------------------- interface (CLI-03i)
# The client's chrome, from the pack's `UI Elements` (artpipe/ui.py; README *UI elements*). Packed
# on their own page(s), `atlas-ui-N`, which the map never loads. `kind`: "nine" (a nine-slice),
# "three" (a horizontal three-slice) or "still" (one image). `pieces`: the lattice of the sheet,
# source bounds in px (3 columns; 3 rows, or the 1 row of a multi-row sheet); the pieces are
# composed contiguous, the transparent outer margin trimmed (recorded as `outset`). `states`: a
# pressed sheet of the same layout, its face `drop` px lower. `slice` and `content` are
# [top, right, bottom, left] in art px of the trimmed image: the parts kept unscaled at the edges,
# and where text may sit. `fill`: the middle parts "stretch", or repeat ("round") where the art is
# textured. The build refuses a stretched edge that is not uniform (settings `ui_edge`).


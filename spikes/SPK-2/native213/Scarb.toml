# Fix loop 1: the native contracts' sources (../native/src, copied by devnet_measure.py before the
# build) compiled with Cairo 2.13 (Sierra 1.7.0) instead of 2.19 (Sierra 1.9.3), to see whether
# the node meters a class by its Sierra version. Not a package of the game.
[package]
name = "spk2n"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.13"

[cairo]
sierra-replace-ids = true

[dependencies]
starknet = "2.13"

[[target.starknet-contract]]
sierra = true
casm = true

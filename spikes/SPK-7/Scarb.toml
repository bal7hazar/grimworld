[package]
name = "spk7"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19"

[cairo]
sierra-replace-ids = true

[dependencies]
starknet = "2.19"
origami_hexmap = "1.8.0"

[dev-dependencies]
snforge_std = "0.61"
assert_macros = "2.19"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# The oracle tests (every overlap case of the assembly, every pair of the line of sight) run tens
# of millions of Cairo steps.
[tool.snforge]
max_n_steps = 100000000

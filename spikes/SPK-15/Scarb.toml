[package]
name = "spk15"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19"

[cairo]
sierra-replace-ids = true

[dependencies]
starknet = "2.19"
# The game's shared package by path: main's code at the spike's base (SPK-15's brief). CBT-04's and
# CBT-03a's functions, not merged, are copied into `src/cbt04.cairo` and `src/cbt03a.cairo`, each
# with a header naming its source file and commit.
grimworld_logic = { path = "../../contracts/logic" }

[dev-dependencies]
snforge_std = "0.61"
assert_macros = "2.19"

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
max_n_steps = 200000000

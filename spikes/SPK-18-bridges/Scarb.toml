[package]
name = "spk18"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.20"

[dependencies]
starknet = "2.20"
hexx = "0.2.0"
# The game's package by path, main's code at the spike's base (862c972), as SPK-16 and SPK-17 do:
# the packing helpers and the members' and goblins' word offsets (ENG-01 §3.2).
grimworld_logic = { path = "../../contracts/logic" }

[dev-dependencies]
snforge_std = "0.64"
assert_macros = "2.20"

[lib]

[cairo]
sierra-replace-ids = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

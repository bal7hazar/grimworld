[package]
name = "spk4-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "SPK-4: runs the spike's Scarb executable (Cairo 2.19) on cairo-vm 3.2.0, natively and in WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spk4-run"
path = "src/main.rs"

[dependencies]
cairo-vm = { version = "=3.2.0", features = ["cairo-1-hints"] }
# The compiler's own version: the hints of a Scarb 2.19.4 executable, deserialized by the casm
# crate of the same line.
cairo-lang-casm = "~2.19.4"
serde = "1"
serde_json = "1"
num-bigint = "0.4"

# What wasm32-unknown-unknown needs and nothing else: the bindings, and the JavaScript source of
# randomness for getrandom 0.2, which cairo-vm pulls through rand 0.8. The VM never draws
# randomness on this path; getrandom only has to link.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
codegen-units = 1

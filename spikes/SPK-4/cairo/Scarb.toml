[package]
name = "spk4"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19"

# The pure library and its tests. The executables are in ../exec: an executable target needs gas
# calculation disabled, and snforge needs it enabled.

[dev-dependencies]
snforge_std = "0.61"
assert_macros = "2.19"

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Not named Scarb.toml on purpose: the CI runs `snforge test` in every Scarb.toml it finds, and
# snforge refuses a package without gas calculation, which an executable target requires. The
# logic these executables call is in ../cairo/logic, gated by the CI with its tests; this wrapper
# is built and run by the spike's scripts (`scarb --manifest-path spikes/SPK-4/exec/Scarb.exec.toml
# build`). An escalation of SPK-4's report asks for a CI rule for executable packages.
[package]
name = "spk4_exec"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19"

[cairo]
enable-gas = false

[dependencies]
spk4 = { path = "../cairo/logic" }
cairo_execute = "2.19"

# `step`: one action, as the client calls it. `batch`: many cases in one run, each result printed
# as it is computed, to generate the vectors (spikes/SPK-4/generate.py).
[[target.executable]]
name = "step"
function = "spk4_exec::step"

[[target.executable]]
name = "batch"
function = "spk4_exec::batch"

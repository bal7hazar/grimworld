[workspace]
members = ["logic", "persistent", "ephemeral"]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19"

[workspace.dependencies]
starknet = "2.19"
snforge_std = "0.61"
assert_macros = "2.19"
hexx = "0.1.0-rc.1"

[cairo]
sierra-replace-ids = true

[workspace.scripts]
test = "snforge test"

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[package]
name = "grimworld_persistent"
version.workspace = true
edition.workspace = true
cairo-version.workspace = true

[dependencies]
starknet.workspace = true
grimworld_logic = { path = "../logic" }

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

# D-153: a library target beside the contracts, so that the indexer's emitter (IDX-01a) reuses
# ENG-01's event types instead of copying them.
[lib]

[[target.starknet-contract]]
sierra = true
casm = true
# CBT-02e (D-168): `Hub.set_build` calls `FlattenLibrary` by `library_call`; its tests declare it.
# ENG-09: the authored zone's reveal, `HostsLibrary` reading `Registry`, is tested on the real path.
build-external-contracts = [
    "grimworld_logic::systems::flatten::FlattenLibrary",
    "grimworld_logic::systems::hosts::HostsLibrary",
    "grimworld_logic::systems::reveal::RevealLibrary",
]

[scripts]
test.workspace = true

[package]
name = "grimworld_ephemeral"
version.workspace = true
edition.workspace = true
cairo-version.workspace = true

[dependencies]
starknet.workspace = true
grimworld_logic = { path = "../logic" }

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

# ENG-05 (ENG-01 §1.3): `Instances` calls `RevealLibrary`, `HostsLibrary` (D-210) and
# `TrapLibrary` (CBT-05b, D-222) by `library_call`, and `play` (ENG-07, D-236) `PlayLibrary`, which
# calls `SegmentLibrary`, `TickLibrary`, `AiLibrary`, `ActionLibrary`, `ExecutorLibrary`; its tests
# declare them.
[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = [
    "grimworld_logic::systems::hosts::HostsLibrary",
    "grimworld_logic::systems::reveal::RevealLibrary",
    "grimworld_logic::systems::trap::TrapLibrary",
    "grimworld_logic::systems::tick::TickLibrary",
    "grimworld_logic::systems::ai::AiLibrary",
    "grimworld_logic::systems::action::ActionLibrary",
    "grimworld_logic::systems::executor::ExecutorLibrary",
    "grimworld_logic::systems::segment::SegmentLibrary",
]

[scripts]
test.workspace = true

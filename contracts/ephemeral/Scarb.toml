[package]
name = "grimworld_ephemeral"
version.workspace = true
edition.workspace = true
cairo-version.workspace = true

[dependencies]
starknet.workspace = true
grimworld_logic = { path = "../logic" }

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

# ENG-05 (ENG-01 §1.3): `Instances` calls `RevealLibrary` by `library_call`; its tests declare it.
[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["grimworld_logic::systems::reveal::RevealLibrary"]

[scripts]
test.workspace = true

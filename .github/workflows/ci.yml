# CI of the contracts, the client and the indexer (FND-02, D-153), beside the `tooling` workflow.
# "Merge on green CI" means the code works: every Cairo package is formatted, built and tested on
# the toolchain of its own .tool-versions; the pnpm workspace (client and indexer) is installed,
# linted, typechecked, tested, built and formatted; a change to indexer/ also runs the indexer on a
# local starknet-devnet.
# No secret, no pull_request_target, read-only token, every third-party action pinned by SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The list of Cairo jobs is discovered, not written down: every tracked Scarb.toml is a job root
  # or a member of a workspace that is one, so a new spike or package is gated the day it lands
  # and none can be forgotten (a manifest that is neither fails the discovery). A Scarb workspace
  # (contracts/) is one job at its root. The toolchain is read the way asdf reads it locally: per
  # tool, the nearest .tool-versions going up from the folder. A package that pins its own Cairo
  # (D-122, spikes/SPK-5 on 2.13) gets that Scarb and that snforge; the others get the root pins.
  # A pull request controls those files, so this job validates every version (exact x.y.z) and
  # every path BEFORE any setup step; see .github/ci/discover.py.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.find.outputs.packages }}
      node: ${{ steps.find.outputs.node }}
      pnpm: ${{ steps.find.outputs.pnpm }}
      cairo: ${{ steps.changes.outputs.cairo }}
      classes: ${{ steps.changes.outputs.classes }}
      client: ${{ steps.changes.outputs.client }}
      indexer: ${{ steps.changes.outputs.indexer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: find
        run: python3 .github/ci/discover.py

      # Which jobs does the change concern (FND-18, docs/briefs/FND-18-ci-paths.md)? The test jobs
      # below run only when a path they depend on changed: the Cairo packages (and the packages
      # they depend on by path), `class-artefacts`, `client`, and `indexer-node` (only for
      # indexer/, as before). A workflow or a CI helper runs everything, and so does a path that no
      # rule claims; a documents-only change runs no test. A pull request is compared with its base,
      # a push with the commit before it (a push to main still runs every job but `indexer-node`);
      # the base commit is fetched alone (the checkout is shallow). An unknown base (a new branch, a
      # malformed value) runs everything. Event values reach the script as environment variables,
      # never interpolated into it.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PACKAGES: ${{ steps.find.outputs.packages }}
        run: python3 .github/ci/changes.py --workflow ci

  cairo:
    needs: discover
    # An empty matrix fails a job: it runs only when some package is concerned (FND-18).
    if: needs.discover.outputs.cairo != '[]'
    name: cairo (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # D-176 (FND-10's scope, folded into FND-11): the compiler's withdraw_gas placement follows rayon's
    # thread order, so every measured or declared build is single-threaded (docs/CAIRO.md §2).
    env:
      RAYON_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.cairo) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      # The `assets` submodule is private and never needed here: it is not checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry (packages and prebuilt plugins) and the package's target folder are cached, keyed
      # by the package's Scarb.lock; main's own runs fill the cache that pull requests restore.
      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_try1
        continue-on-error: true
        with:
          scarb-version: ${{ matrix.scarb }}
          scarb-lock: ${{ matrix.dir }}/Scarb.lock
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_try1.outcome == 'failure'
        with:
          scarb-version: ${{ matrix.scarb }}
          scarb-lock: ${{ matrix.dir }}/Scarb.lock

      # snforge and universal-sierra-compiler from their release archives, SHA-256 pinned and
      # verified before extraction: foundry-rs/setup-snfoundry would call a mutable action tag.
      - name: snforge
        working-directory: .
        env:
          SNFORGE: ${{ matrix.snforge }}
        run: bash .github/ci/install-snforge.sh

      - name: toolchain is the one of the nearest .tool-versions
        env:
          SCARB: ${{ matrix.scarb }}
          SNFORGE: ${{ matrix.snforge }}
        run: |
          set -euo pipefail
          scarb --version
          snforge --version
          scarb --version | grep -q "^scarb $SCARB " || { echo "scarb is not $SCARB" >&2; exit 1; }
          snforge --version | grep -qx "snforge $SNFORGE" || { echo "snforge is not $SNFORGE" >&2; exit 1; }

      - name: format
        run: scarb fmt --check --workspace

      # Only scarb and snforge: no sozo, katana, torii or devnet is needed to build and test.
      - name: build
        run: scarb build --workspace

      - name: test
        run: snforge test --workspace

      # docs/CAIRO.md §2 enforced by a tool (FND-06): every test has a budget of ceil(1.05 x
      # measured) or lower, and docs/BUDGETS.md and the GAS.md files match the run. The tests
      # run a second time (compiled already, seconds), for the figures.
      - name: gas budgets
        if: matrix.dir == 'contracts'
        working-directory: .
        run: |
          set -euo pipefail
          # origin/main is the baseline of the raise check and the history holds the commits of
          # BUDGETS.md: the checkout is shallow and has no origin/main, so fetch both.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --no-tags --unshallow origin; fi
          python3 scripts/gas_budgets.py --self-test
          python3 scripts/gas_budgets.py --check --no-lock

      # ENG-01 (E-10): every contract class under Starknet's size limits (ADR-0007), from the
      # build above; it fails at a limit or at half of one (split before a class grows past it).
      - name: class sizes
        if: matrix.dir == 'contracts'
        working-directory: .
        run: python3 contracts/tools/class_sizes.py

      # ENG-02a (D-140): the table of 2^(x/40) is generated once, for the contracts and the client;
      # a stale or hand-edited copy of either file fails here.
      - name: exp2 table is current
        if: matrix.dir == 'contracts'
        working-directory: .
        run: python3 contracts/tools/exp2_table.py --check

      # ENG-02 (and CBT-03a's review minor): the committed vector tables of the game's logic
      # (contracts/logic/vectors/*.jsonl, the client's mirror reads them) checked against what the
      # code prints; a stale or hand-edited table fails here. CBT-03a's hit.jsonl joins it at its merge.
      - name: vectors are current
        if: matrix.dir == 'contracts'
        working-directory: .
        run: python3 contracts/logic/vectors/check.py

      # D-176 / SPK-13: three clean builds give one CASM and one Sierra size per class. Not a class
      # hash: it depends on the absolute build path (closure type names), SPK-13b, #283. Last, as it
      # cleans the target folder.
      - name: three clean builds agree
        if: matrix.dir == 'contracts'
        run: python3 ../.github/ci/build_stable.py

  # FND-12 (SPK-13b, #283): the contracts' class files built once, at CI's checkout root, and kept.
  # A class hash depends on the absolute build path, so a class that is declared on a network is
  # one of these files, never a local worktree build; build-root.json records the root, the commit,
  # the Scarb version and the OS it came from (OPERATIONS §7). A job of its own, not a step of the
  # `cairo` matrix: one clean build of exactly contracts/, uploaded once, whatever the matrix does
  # (no cache restored, target/ removed before the build, snforge's *.test.* files left out).
  # On a pull request the checkout is the head commit, not the merge commit, so the build, the
  # artefact's name and build-root.json's commit are one commit. A class to declare comes from the
  # artefact of a push to main (OPERATIONS §7), not from a pull request's run.
  # RAYON_NUM_THREADS=1 is the repository's build pin (D-176). No class hash is computed here.
  class-artefacts:
    needs: discover
    if: needs.discover.outputs.classes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - id: pins
        env:
          PACKAGES: ${{ needs.discover.outputs.packages }}
        run: |
          set -euo pipefail
          scarb=$(python3 -c 'import json, os; print(next(p["scarb"] for p in json.loads(os.environ["PACKAGES"]) if p["dir"] == "contracts"))')
          [[ $scarb =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "scarb $scarb" >&2; exit 1; }
          echo "scarb=$scarb" >> "$GITHUB_OUTPUT"

      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_try1
        continue-on-error: true
        with:
          scarb-version: ${{ steps.pins.outputs.scarb }}
          # No registry or target/ cache: the build below starts from nothing.
          cache: false
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_try1.outcome == 'failure'
        with:
          scarb-version: ${{ steps.pins.outputs.scarb }}
          # No registry or target/ cache: the build below starts from nothing.
          cache: false

      - name: build at CI's root
        env:
          RAYON_NUM_THREADS: "1"
          SCARB: ${{ steps.pins.outputs.scarb }}
          # The commit the checkout holds (see the job's comment).
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scarb --version | grep -q "^scarb $SCARB " || { echo "scarb is not $SCARB" >&2; exit 1; }
          cd contracts
          rm -rf target
          scarb build --workspace
          # Written by python so that no value is interpolated into a shell string.
          python3 - <<'PY'
          import json, os, subprocess
          scarb = subprocess.run(["scarb", "--version"], capture_output=True, text=True, check=True).stdout.splitlines()[0]
          record = {
              "root": os.environ["GITHUB_WORKSPACE"],
              "commit": os.environ["COMMIT"],
              "scarb": scarb.split()[1],
              "os": f'{os.environ["RUNNER_OS"]} {os.environ["ImageOS"]} {os.environ["ImageVersion"]}',
          }
          with open("target/build-root.json", "w") as f:
              json.dump(record, f, indent=2)
              f.write("\n")
          print(json.dumps(record, indent=2))
          PY
          find target -type f ! -name '*.test.*' \( -name '*.contract_class.json' -o -name '*.compiled_contract_class.json' \) | sort

      # 90 days: the most the default plan keeps, so a declaration can follow its merge by weeks.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-classes-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            contracts/target/**/*.contract_class.json
            contracts/target/**/*.compiled_contract_class.json
            !contracts/target/**/*.test.*
            contracts/target/build-root.json
          retention-days: 90
          if-no-files-found: error

  client:
    needs: discover
    if: needs.discover.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The validated pnpm of .tool-versions is passed explicitly: the action would otherwise read
      # package.json, where devEngines can take priority. `discover` checked that package.json says
      # the same, exactly.
      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        id: pnpm_try1
        continue-on-error: true
        with:
          version: ${{ needs.discover.outputs.pnpm }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pnpm_try1.outcome == 'failure'
        with:
          version: ${{ needs.discover.outputs.pnpm }}

      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node_try1
        continue-on-error: true
        with:
          node-version: ${{ needs.discover.outputs.node }}
          cache: pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.node_try1.outcome == 'failure'
        with:
          node-version: ${{ needs.discover.outputs.node }}
          cache: pnpm

      - name: toolchain is the one of .tool-versions
        env:
          node_pin: ${{ needs.discover.outputs.node }}
          pnpm_pin: ${{ needs.discover.outputs.pnpm }}
        run: |
          set -euo pipefail
          echo "node $(node --version), pnpm $(pnpm --version)"
          [ "$(node --version)" = "v$node_pin" ] || { echo "node is not $node_pin" >&2; exit 1; }
          [ "$(pnpm --version)" = "$pnpm_pin" ] || { echo "pnpm is not $pnpm_pin" >&2; exit 1; }

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # The client and the indexer (D-153). Their build outputs are in the root .gitignore, which
      # prettier reads, so the `build` above does not reach this check.
      - name: prettier
        run: pnpm exec prettier --check client indexer

  # IDX-01a (D-153): the indexer's local-node scenario (`pnpm --filter @grimworld/indexer
  # test:node`: deploy the test emitter on starknet-devnet, emit the nine events, reorgs of depth 1
  # to 5 by devnet_abortBlocks, restart, rebuild, pruning). It runs only when the change touches
  # indexer/ (`discover` compares the tree with the base; D-153's grant), or when the base is
  # unknown, or for a change to a workflow or a CI helper (FND-18: those run every job). It does NOT
  # run for a change elsewhere, even one it depends on: .tool-versions,
  # scripts/setup-toolchain.sh, scripts/with-node.sh, contracts/persistent (the events).
  # Such a change is checked by this job at the next change under indexer/, not before
  # (widening the trigger is with the project manager). Every version comes from `discover` (validated
  # there) or is pinned here and checked against the repository's pins: starknet-devnet as
  # scripts/setup-toolchain.sh pins it, its release tarball verified by sha256 before it is
  # unpacked and its binary before it is run. No secret; the network is the package registries and
  # the devnet release download. The node listens on 127.0.0.1 only (scripts/with-node.sh).
  indexer-node:
    needs: discover
    if: needs.discover.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEVNET_VERSION: 0.10.0
      # sha256 of starknet-devnet-x86_64-unknown-linux-gnu.tar.gz of release v0.10.0: pinned here
      # only. The binary's sha256 lives in scripts/setup-toolchain.sh (`binary_sha256`,
      # `starknet-devnet:0.10.0:amd64`) and is repeated below; a devnet bump edits both files, and
      # .tool-versions.
      DEVNET_TARBALL_SHA256: 0d27863ec959dc74ec6de985c3ec8eb093d6670bacd7672b51dc71ec8528969b
      # The binary inside it: the same value as scripts/setup-toolchain.sh (checked by `pins`).
      DEVNET_BINARY_SHA256: 4e2e6479fa9502f2952ed26740d5cc8ebeb3695c16e752edcc560f6e736b167c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Scarb of the emitter's job (validated by discover), and the pins above against the
      # repository's. When this job runs, it fails if .tool-versions or setup-toolchain.sh pin
      # another devnet than this job; a bump in those files alone does not run it (see above).
      - name: pins
        id: pins
        env:
          PACKAGES: ${{ needs.discover.outputs.packages }}
        run: |
          set -euo pipefail
          [ "$(uname -s) $(uname -m)" = "Linux x86_64" ] || { echo "not Linux x86_64" >&2; exit 1; }
          scarb=$(python3 -c 'import json, os; print(next(p["scarb"] for p in json.loads(os.environ["PACKAGES"]) if p["dir"] == "indexer/emitter"))')
          [[ $scarb =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "scarb $scarb" >&2; exit 1; }
          pinned=$(awk '$1 == "starknet-devnet" { print $2 }' .tool-versions)
          [ "$pinned" = "$DEVNET_VERSION" ] || { echo ".tool-versions pins starknet-devnet $pinned, this job $DEVNET_VERSION" >&2; exit 1; }
          grep -qF "starknet-devnet:$DEVNET_VERSION:amd64) echo $DEVNET_BINARY_SHA256 ;;" scripts/setup-toolchain.sh ||
            { echo "scripts/setup-toolchain.sh pins another binary hash" >&2; exit 1; }
          echo "scarb=$scarb" >> "$GITHUB_OUTPUT"

      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_try1
        continue-on-error: true
        with:
          scarb-version: ${{ steps.pins.outputs.scarb }}
          scarb-lock: indexer/emitter/Scarb.lock
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_try1.outcome == 'failure'
        with:
          scarb-version: ${{ steps.pins.outputs.scarb }}
          scarb-lock: indexer/emitter/Scarb.lock

      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        id: pnpm_try1
        continue-on-error: true
        with:
          version: ${{ needs.discover.outputs.pnpm }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pnpm_try1.outcome == 'failure'
        with:
          version: ${{ needs.discover.outputs.pnpm }}

      # A registry or release download that fails (HTTP 5xx) is tried once more (FND-13).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node_try1
        continue-on-error: true
        with:
          node-version: ${{ needs.discover.outputs.node }}
          cache: pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.node_try1.outcome == 'failure'
        with:
          node-version: ${{ needs.discover.outputs.node }}
          cache: pnpm

      - name: toolchain is the one of .tool-versions
        env:
          node_pin: ${{ needs.discover.outputs.node }}
          pnpm_pin: ${{ needs.discover.outputs.pnpm }}
          scarb_pin: ${{ steps.pins.outputs.scarb }}
        run: |
          set -euo pipefail
          echo "node $(node --version), pnpm $(pnpm --version), $(scarb --version | head -n 1)"
          [ "$(node --version)" = "v$node_pin" ] || { echo "node is not $node_pin" >&2; exit 1; }
          [ "$(pnpm --version)" = "$pnpm_pin" ] || { echo "pnpm is not $pnpm_pin" >&2; exit 1; }
          scarb --version | grep -q "^scarb $scarb_pin " || { echo "scarb is not $scarb_pin" >&2; exit 1; }

      - name: starknet-devnet
        run: |
          set -euo pipefail
          dir=$RUNNER_TEMP/starknet-devnet
          mkdir -p "$dir"
          curl -fsSL --retry 3 --retry-delay 5 --proto '=https' --tlsv1.2 -o "$dir/devnet.tar.gz" \
            "https://github.com/0xSpaceShard/starknet-devnet/releases/download/v${DEVNET_VERSION}/starknet-devnet-x86_64-unknown-linux-gnu.tar.gz"
          echo "$DEVNET_TARBALL_SHA256  $dir/devnet.tar.gz" | sha256sum -c -
          tar -xzf "$dir/devnet.tar.gz" -C "$dir" starknet-devnet
          echo "$DEVNET_BINARY_SHA256  $dir/starknet-devnet" | sha256sum -c -
          [ "$("$dir/starknet-devnet" --version)" = "starknet-devnet $DEVNET_VERSION" ] ||
            { echo "starknet-devnet is not $DEVNET_VERSION" >&2; exit 1; }
          echo "$dir" >> "$GITHUB_PATH"

      - name: install
        run: pnpm install --frozen-lockfile

      - name: emitter
        run: scarb --manifest-path indexer/emitter/Scarb.toml build

      - name: test:node
        run: pnpm --filter @grimworld/indexer test:node

      - name: scenario output
        if: always()
        run: cat indexer/.scenario-results.txt 2> /dev/null || echo "no scenario output"

  # FND-18: the one check that always runs, so that `gh pr checks` has a result whichever test jobs the
  # change concerned. It fails when a needed job failed or was cancelled, and passes when every one
  # succeeded or was skipped (a job its paths did not concern).
  result:
    name: ci result
    needs: [discover, cairo, class-artefacts, client, indexer-node]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          bad = []
          for job, need in json.loads(os.environ["RESULTS"]).items():
              result = need["result"]
              print(f"{job}: {result}")
              if result not in ("success", "skipped"):
                  bad.append(job)
          if bad:
              raise SystemExit("not passed: " + ", ".join(bad))
          PY
# fnd-18 verification

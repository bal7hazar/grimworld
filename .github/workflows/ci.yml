# CI of the contracts and the client (FND-02), beside the `tooling` workflow. "Merge on green CI"
# means the code works: every Cairo package is formatted, built and tested on the toolchain of its
# own .tool-versions, and the client is installed, linted, typechecked, tested, built and formatted.
# No secret, no pull_request_target, read-only token, every third-party action pinned by SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The list of Cairo packages is discovered, not written down: every tracked Scarb.toml is a
  # package, so a new spike or package is gated the day it lands, and none can be forgotten. Its
  # toolchain is read the way asdf reads it locally: per tool, the nearest .tool-versions going up
  # from the package folder to the root. A package that pins its own Cairo (D-122) gets that Scarb
  # and that snforge; the others get the root pins (Cairo 2.13, the game's).
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: find
        run: |
          set -euo pipefail
          # nearest_version <folder> <tool>: the version of <tool> in the nearest .tool-versions
          nearest_version() {
            local dir=$1 tool=$2 v
            while true; do
              if [ -f "$dir/.tool-versions" ]; then
                v=$(awk -v t="$tool" '$1 == t { print $2; exit }' "$dir/.tool-versions")
                if [ -n "$v" ]; then echo "$v"; return 0; fi
              fi
              if [ "$dir" = "." ]; then return 1; fi
              dir=$(dirname "$dir")
            done
          }
          packages='[]'
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            scarb=$(nearest_version "$dir" scarb)
            snforge=$(nearest_version "$dir" starknet-foundry)
            packages=$(jq -c --arg dir "$dir" --arg scarb "$scarb" --arg snforge "$snforge" \
              '. + [{dir: $dir, scarb: $scarb, snforge: $snforge}]' <<< "$packages")
          done < <(git ls-files '*Scarb.toml' | sort)
          if [ "$packages" = '[]' ]; then echo "no Cairo package found" >&2; exit 1; fi
          echo "$packages" | jq .
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  cairo:
    needs: discover
    name: cairo (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      # The `assets` submodule is private and never needed here: it is not checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry (packages and prebuilt plugins) and the package's target folder are cached, keyed
      # by the package's Scarb.lock; main's own runs fill the cache that pull requests restore.
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: ${{ matrix.scarb }}
          scarb-lock: ${{ matrix.dir }}/Scarb.lock

      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: ${{ matrix.snforge }}

      - name: toolchain is the one of the nearest .tool-versions
        env:
          SCARB: ${{ matrix.scarb }}
          SNFORGE: ${{ matrix.snforge }}
        run: |
          set -euo pipefail
          scarb --version
          snforge --version
          scarb --version | grep -q "^scarb $SCARB " || { echo "scarb is not $SCARB" >&2; exit 1; }
          snforge --version | grep -qx "snforge $SNFORGE" || { echo "snforge is not $SNFORGE" >&2; exit 1; }

      - name: format
        run: scarb fmt --check

      # The Dojo packages build with scarb and test with snforge (what `sozo build` and `sozo test`
      # run underneath), so that sozo does not have to be installed.
      - name: build
        run: scarb build

      - name: test
        run: snforge test

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm's version is read from `packageManager` in the root package.json (12.5.1).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: toolchain is the one of .tool-versions
        run: |
          set -euo pipefail
          node_pin=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
          pnpm_pin=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)
          echo "node $(node --version), pnpm $(pnpm --version)"
          [ "$(node --version)" = "v$node_pin" ] || { echo "node is not $node_pin" >&2; exit 1; }
          [ "$(pnpm --version)" = "$pnpm_pin" ] || { echo "pnpm is not $pnpm_pin" >&2; exit 1; }

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      - name: prettier
        run: pnpm exec prettier --check client

# Minimal CI of the agent tooling (FND-03), so that "merge on green CI" holds from the first pull
# request. FND-02 builds the real CI of contracts and client beside it.
name: tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The `assets` submodule is private and never needed here: it is not checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

      - name: launcher dry-run
        run: |
          set -euo pipefail
          out=$(scripts/agent.sh --dry-run smoke claude sonnet new "x" research)
          echo "$out"
          grep -q -- '^claude -p .* --permission-mode acceptEdits --allowedTools ' <<< "$out"
          if grep -q -- '--dangerously' <<< "$out"; then echo "dangerous flag in a launch" >&2; exit 1; fi
          for profile in research audit implement; do
            for model in sonnet opus fable; do
              out=$(scripts/agent.sh --dry-run smoke claude "$model" new "x" "$profile")
              if grep -q -- '--dangerously' <<< "$out"; then echo "dangerous flag: $profile" >&2; exit 1; fi
            done
          done
          # Resume needs a launch record: fixtures, one task per recorded model.
          logs=.claude/worktrees/logs; mkdir -p "$logs"
          echo "claude claude-opus-5-5" > "$logs/resumeopus.cli"
          echo "codex gpt-6-sol" > "$logs/resumecodex.cli"
          grep -q -- '^# \[Opus 5.5\] resumeopus resume (implement)' \
            <<< "$(scripts/agent.sh --dry-run resumeopus claude opus resume "x" implement)"
          for model in gpt-6-astra gpt-6-sol gpt-6-luna; do
            out=$(scripts/agent.sh --dry-run smoke codex "$model" new "x")
            grep -q -- ' -s read-only ' <<< "$out"
            if grep -q -- '--dangerously' <<< "$out"; then echo "dangerous flag: codex" >&2; exit 1; fi
          done
          grep -qF -- "-c sandbox_mode=\\\"read-only\\\" " \
            <<< "$(scripts/agent.sh --dry-run resumecodex codex gpt-6-sol resume "x" audit 0000)"
          # Refusals: codex never implements; a model without a known tag is never launched;
          # only the three named profiles exist.
          if scripts/agent.sh --dry-run smoke codex gpt-6-sol new "x" implement; then exit 1; fi
          if scripts/agent.sh --dry-run smoke claude sonnet-4 new "x"; then exit 1; fi
          # The sonnet alias is Sonnet 5.5; Sonnet 5 stays accepted to resume an agent started on it.
          grep -q -- '^# \[Sonnet 5.5\] smoke new ' <<< "$(scripts/agent.sh --dry-run smoke claude sonnet new "x")"
          grep -q -- ' --model claude-sonnet-5-5 ' <<< "$(scripts/agent.sh --dry-run smoke claude claude-sonnet-5-5 new "x")"
          # Resume needs the launch record and the same model; Sonnet 5 never starts a new task;
          # a task whose worktree exists is not relaunched with new.
          echo "claude claude-sonnet-5" > "$logs/legacy.cli"
          grep -q -- '^# \[Sonnet 5\] legacy resume ' <<< "$(scripts/agent.sh --dry-run legacy claude claude-sonnet-5 resume "x" research)"
          if scripts/agent.sh --dry-run legacy claude sonnet resume "x" research; then exit 1; fi
          if scripts/agent.sh --dry-run norecord claude opus resume "x" research; then exit 1; fi
          if scripts/agent.sh --dry-run fresh claude claude-sonnet-5 new "x" research; then exit 1; fi
          mkdir -p .claude/worktrees/cli-legacy
          if scripts/agent.sh --dry-run legacy claude sonnet new "x" research; then exit 1; fi
          if scripts/agent.sh --dry-run smoke claude sonnet new "x" ../profiles/implement; then exit 1; fi
          # Every claude launch empties the registry token; the profiles deny publishing and the settings file.
          # The exact empty override, on new and resumed launches, for every profile. These dry runs prove the
          # arguments the launcher passes, not their effect at run time (settings precedence is Claude Code's;
          # the same-user settings file stays readable by code an agent runs: OPERATIONS §4, accepted residual).
          settings='--settings \{\"env\":\{\"SCARB_REGISTRY_AUTH_TOKEN\":\"\"\,\"STARKNET_NETWORK\":\"\"\,\"STARKNET_RPC_URL\":\"\"\,\"STARKNET_RPC\":\"\"\,\"STARKNET_ACCOUNT_ADDRESS\":\"\"\,\"STARKNET_PRIVATE_KEY\":\"\"\}\}'
          echo "claude claude-opus-5-5" > "$logs/tokenprobe.cli"
          for profile in research audit implement; do
            grep -qF -- "$settings" <<< "$(scripts/agent.sh --dry-run tokennew claude opus new "x" "$profile")"
            grep -qF -- "$settings" <<< "$(scripts/agent.sh --dry-run tokenprobe claude opus resume "x" "$profile")"
          done
          # The Sepolia account is emptied unless --with-sepolia, which keeps only the token emptied, and only for a
          # task whose brief grants it (SPK-1's does); codex refuses it; a resume without it says so.
          only_token='--settings \{\"env\":\{\"SCARB_REGISTRY_AUTH_TOKEN\":\"\"\}\}'
          echo "claude claude-opus-5-5" > "$logs/SPK-1.cli"
          export GW_BRIEF_REF=HEAD   # the briefs of this commit, not of origin/main
          out=$(scripts/agent.sh --dry-run --with-sepolia SPK-1 claude opus resume "x" implement)
          grep -qF -- "$only_token" <<< "$out"
          grep -qF -- 'with-sepolia=1' <<< "$out"
          if scripts/agent.sh --dry-run --with-sepolia sepnew claude opus new "x" implement; then exit 1; fi
          if scripts/agent.sh --dry-run --with-sepolia tokenprobe claude opus resume "x" implement; then exit 1; fi
          # a brief that grants the account for another profile does not grant it for this one
          if scripts/agent.sh --dry-run --with-sepolia SPK-1 claude opus resume "x" research; then exit 1; fi
          # GW_BRIEF_REF is honoured by dry runs only (a real launch reads the grant from origin/main);
          # no real launch is ever run here, so that line of the launcher is checked by review.
          if grep -qF -- "$only_token" <<< "$(scripts/agent.sh --dry-run sepnew claude opus new "x" implement)"; then exit 1; fi
          if scripts/agent.sh --dry-run --with-sepolia sepcodex codex gpt-6-sol new "x"; then exit 1; fi
          date > "$logs/SPK-1.sepolia"
          grep -q 'runs without the Sepolia account' <<< "$(scripts/agent.sh --dry-run SPK-1 claude opus resume "x" implement 2>&1)"
          out=$(scripts/agent.sh --dry-run smoke claude opus new "x" implement)
          grep -qF -- 'scarb\ publish' <<< "$out"
          grep -qF -- '.claude/\*\*' <<< "$out"
          # The agent budget (OPERATIONS §3): stub systemctl; three agents refuse, two allow, a counter
          # that fails refuses (exit 4). The launch lock that serialises count and start is not
          # exercised here (dry runs stop before it).
          stubs=$(mktemp -d); fake=$(mktemp -d)   # a fake HOME: no launcher records of the machine
          stub() { printf '#!/bin/sh\n%s\n' "$2" > "$stubs/$1"; chmod +x "$stubs/$1"; }
          stub systemctl 'printf "grimworld-a.service loaded active running a\nhexmap-b.service loaded active running b\nquiver-c.service loaded active running c\n"'
          set +e; HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh thresholds; s=$?; set -e; [ "$s" = 4 ]
          stub systemctl 'printf "grimworld-a.service loaded active running a\nhexmap-b.service loaded active running b\n"'
          HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh thresholds
          stub systemctl 'exit 1'
          set +e; HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh thresholds; s=$?; set -e; [ "$s" = 4 ]
          # Detached agents from the launchers' pid files, in a fake HOME: two launches in one directory
          # count once; a pid file whose live process is not its launch (a reused pid) does not count.
          flogs=$fake/projects/grimworld/.claude/worktrees/logs; mkdir -p "$flogs" "$fake/projects/grimworld/wt" "$fake/projects/grimworld/wt2"
          stub systemctl 'printf "grimworld-a.service loaded active running a\nhexmap-b.service loaded active running b\n"'
          (cd "$fake/projects/grimworld/wt" && exec bash -c 'sleep 120; :' "$flogs/one.log") & echo $! > "$flogs/one.pid"
          (cd "$fake/projects/grimworld/wt" && exec bash -c 'sleep 120; :' "$flogs/two.log") & echo $! > "$flogs/two.pid"
          (cd "$fake/projects/grimworld/wt2" && exec sleep 120) & echo $! > "$flogs/reused.pid"   # right directory, not its launch
          set +e; out=$(HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh thresholds 2>&1); s=$?; set -e
          echo "$out"; [ "$s" = 4 ]; grep -qF '3 Grim World agents running (2 units, 1 detached)' <<< "$out"
          # The launch lock: while another launcher holds it, a launch waits (killed by timeout: 124);
          # once released, the same launch goes on to the count, which refuses (4). Nothing is launched.
          mkdir -p "$fake/orchestrator"
          flock "$fake/orchestrator/agent-launch.lock" sleep 6 & holder=$!; sleep 1
          set +e
          HOME=$fake PATH="$stubs:$PATH" timeout 3 scripts/agent.sh locktest claude opus new "x" research; s=$?
          set -e; [ "$s" = 124 ]; wait "$holder"
          set +e; HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh locktest claude opus new "x" research; s=$?; set -e; [ "$s" = 4 ]
          kill $(cat "$flogs"/*.pid) 2> /dev/null || true; rm -f "$flogs"/*.pid
          # A codex audit started as the native binary, with no launch record, is found by its command line.
          mkdir -p "$fake/projects/grimworld/wt3"
          (cd "$fake/projects/grimworld/wt3" && exec -a codex python3 -c 'import time; time.sleep(120)' exec) & decoy=$!
          sleep 1
          set +e; out=$(HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh thresholds 2>&1); s=$?; set -e
          echo "$out"; [ "$s" = 4 ]; grep -qF '3 Grim World agents running (2 units, 1 detached)' <<< "$out"
          kill "$decoy"
          # A launch record that holds no pid refuses the count.
          echo "not a pid" > "$flogs/bad.pid"
          set +e; out=$(HOME=$fake PATH="$stubs:$PATH" scripts/agent.sh thresholds 2>&1); s=$?; set -e
          echo "$out"; [ "$s" = 4 ]; grep -qF 'holds no pid' <<< "$out"
          rm -f "$flogs/bad.pid"
          # The build lock wraps build and test subcommands only.
          for bad in "rm -rf x" "--heavy pnpm exec sh" "pnpm dlx x" "scarb run x" "sozo execute x" "snforge"; do
            if scripts/lock.sh $bad 2> /dev/null; then echo "lock.sh accepted: $bad" >&2; exit 1; fi
          done
          # Under the heavy lock without the project lock, the order would be reversed: refused.
          if HEAVY_BUILD_LOCK_HELD=1 scripts/lock.sh scarb build 2> /dev/null; then
            echo "lock.sh accepted a reversed lock order" >&2; exit 1
          fi

      - name: no asset file committed (D-73)
        run: |
          set -euo pipefail
          exts='png|jpe?g|gif|webp|bmp|tga|psd|aseprite|ase|kra|svg|wav|ogg|mp3|flac|ttf|otf|woff2?|fnt'
          files=$(git ls-files | grep -iE "\.($exts)\$" || true)
          # A sprite atlas descriptor (TexturePacker-style JSON) is derived from the pack too.
          atlases=$(git ls-files -z '*.json' | xargs -0 -r grep -lE '"frames"[[:space:]]*:' |
            xargs -r grep -lE '"image"[[:space:]]*:' || true)
          if [ -n "$files$atlases" ]; then
            echo "Image, audio, font or atlas files are not allowed in this repository (D-73):" >&2
            echo "$files $atlases" >&2
            exit 1
          fi

      # No pull request moves the submodule pointer: a branch name or a label would prove nothing,
      # since agents create both. The orchestrator moves it by its own commit on main (OPERATIONS §7).
      - name: assets pointer unchanged (D-73)
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          base=$(git ls-tree FETCH_HEAD assets | awk '{print $3}')
          head=$(git ls-tree HEAD assets | awk '{print $3}')
          if [ "$base" != "$head" ]; then
            echo "The assets submodule pointer moved ($base -> $head)." >&2
            exit 1
          fi

# Minimal CI of the agent tooling (FND-03), so that "merge on green CI" holds from the first pull
# request. FND-02 builds the real CI of contracts and client beside it.
name: tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The `assets` submodule is private and never needed here: it is not checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

      - name: launcher dry-run
        run: |
          set -euo pipefail
          out=$(scripts/agent.sh --dry-run smoke claude sonnet new "x" research)
          echo "$out"
          grep -q -- '^claude -p .* --permission-mode acceptEdits --allowedTools ' <<< "$out"
          if grep -q -- '--dangerously' <<< "$out"; then echo "dangerous flag in a launch" >&2; exit 1; fi
          for profile in research audit implement; do
            for model in sonnet opus fable; do
              out=$(scripts/agent.sh --dry-run smoke claude "$model" new "x" "$profile")
              if grep -q -- '--dangerously' <<< "$out"; then echo "dangerous flag: $profile" >&2; exit 1; fi
            done
          done
          # Resume needs a launch record: fixtures, one task per recorded model.
          logs=.claude/worktrees/logs; mkdir -p "$logs"
          echo "claude claude-opus-5-5" > "$logs/resumeopus.cli"
          echo "codex gpt-6-sol" > "$logs/resumecodex.cli"
          grep -q -- '^# \[Opus 5.5\] resumeopus resume (implement)' \
            <<< "$(scripts/agent.sh --dry-run resumeopus claude opus resume "x" implement)"
          for model in gpt-6-astra gpt-6-sol gpt-6-luna; do
            out=$(scripts/agent.sh --dry-run smoke codex "$model" new "x")
            grep -q -- ' -s read-only ' <<< "$out"
            if grep -q -- '--dangerously' <<< "$out"; then echo "dangerous flag: codex" >&2; exit 1; fi
          done
          grep -qF -- "-c sandbox_mode=\\\"read-only\\\" " \
            <<< "$(scripts/agent.sh --dry-run resumecodex codex gpt-6-sol resume "x" audit 0000)"
          # Refusals: codex never implements; a model without a known tag is never launched;
          # only the three named profiles exist.
          if scripts/agent.sh --dry-run smoke codex gpt-6-sol new "x" implement; then exit 1; fi
          if scripts/agent.sh --dry-run smoke claude sonnet-4 new "x"; then exit 1; fi
          # The sonnet alias is Sonnet 5.5; Sonnet 5 stays accepted to resume an agent started on it.
          grep -q -- '^# \[Sonnet 5.5\] smoke new ' <<< "$(scripts/agent.sh --dry-run smoke claude sonnet new "x")"
          grep -q -- ' --model claude-sonnet-5-5 ' <<< "$(scripts/agent.sh --dry-run smoke claude claude-sonnet-5-5 new "x")"
          # Resume needs the launch record and the same model; Sonnet 5 never starts a new task;
          # a task whose worktree exists is not relaunched with new.
          echo "claude claude-sonnet-5" > "$logs/legacy.cli"
          grep -q -- '^# \[Sonnet 5\] legacy resume ' <<< "$(scripts/agent.sh --dry-run legacy claude claude-sonnet-5 resume "x" research)"
          if scripts/agent.sh --dry-run legacy claude sonnet resume "x" research; then exit 1; fi
          if scripts/agent.sh --dry-run norecord claude opus resume "x" research; then exit 1; fi
          if scripts/agent.sh --dry-run fresh claude claude-sonnet-5 new "x" research; then exit 1; fi
          mkdir -p .claude/worktrees/cli-legacy
          if scripts/agent.sh --dry-run legacy claude sonnet new "x" research; then exit 1; fi
          if scripts/agent.sh --dry-run smoke claude sonnet new "x" ../profiles/implement; then exit 1; fi
          # Every claude launch empties the registry token; the profiles deny publishing and the settings file.
          # The exact empty override, on new and resumed launches, for every profile. These dry runs prove the
          # arguments the launcher passes, not their effect at run time (settings precedence is Claude Code's;
          # the same-user settings file stays readable by code an agent runs: OPERATIONS §4, accepted residual).
          settings='--settings \{\"env\":\{\"SCARB_REGISTRY_AUTH_TOKEN\":\"\"\,\"STARKNET_NETWORK\":\"\"\,\"STARKNET_RPC_URL\":\"\"\,\"STARKNET_RPC\":\"\"\,\"STARKNET_ACCOUNT_ADDRESS\":\"\"\,\"STARKNET_PRIVATE_KEY\":\"\"\}\}'
          echo "claude claude-opus-5-5" > "$logs/tokenprobe.cli"
          for profile in research audit implement; do
            grep -qF -- "$settings" <<< "$(scripts/agent.sh --dry-run tokennew claude opus new "x" "$profile")"
            grep -qF -- "$settings" <<< "$(scripts/agent.sh --dry-run tokenprobe claude opus resume "x" "$profile")"
          done
          # The Sepolia account is emptied unless --with-sepolia, which keeps only the token emptied, and only for a
          # task whose brief grants it (SPK-1's does); codex refuses it; a resume without it says so.
          only_token='--settings \{\"env\":\{\"SCARB_REGISTRY_AUTH_TOKEN\":\"\"\}\}'
          echo "claude claude-opus-5-5" > "$logs/SPK-1.cli"
          export GW_BRIEF_REF=HEAD   # the briefs of this commit, not of origin/main
          out=$(scripts/agent.sh --dry-run --with-sepolia SPK-1 claude opus resume "x" implement)
          grep -qF -- "$only_token" <<< "$out"
          grep -qF -- 'with-sepolia=1' <<< "$out"
          if scripts/agent.sh --dry-run --with-sepolia sepnew claude opus new "x" implement; then exit 1; fi
          if scripts/agent.sh --dry-run --with-sepolia tokenprobe claude opus resume "x" implement; then exit 1; fi
          # a brief that grants the account for another profile does not grant it for this one
          if scripts/agent.sh --dry-run --with-sepolia SPK-1 claude opus resume "x" research; then exit 1; fi
          # GW_BRIEF_REF is honoured by dry runs only (a real launch reads the grant from origin/main);
          # no real launch is ever run here, so that line of the launcher is checked by review.
          if grep -qF -- "$only_token" <<< "$(scripts/agent.sh --dry-run sepnew claude opus new "x" implement)"; then exit 1; fi
          if scripts/agent.sh --dry-run --with-sepolia sepcodex codex gpt-6-sol new "x"; then exit 1; fi
          date > "$logs/SPK-1.sepolia"
          grep -q 'runs without the Sepolia account' <<< "$(scripts/agent.sh --dry-run SPK-1 claude opus resume "x" implement 2>&1)"
          out=$(scripts/agent.sh --dry-run smoke claude opus new "x" implement)
          grep -qF -- 'scarb\ publish' <<< "$out"
          # D-132: no agent publishes, whatever the flags before the subcommand (the deny patterns reach
          # the implement profile; cargo is allowed for named subcommands only, never publish).
          for rule in 'scarb\ publish\*' 'scarb\ \*\ publish\*'; do grep -qF -- "$rule" <<< "$out"; done
          if grep -qF -- 'Bash\(cargo\ \*\)' <<< "$out"; then echo "cargo allowed with any subcommand" >&2; exit 1; fi
          grep -qF -- '.claude/\*\*' <<< "$out"
          # The budget as slots (OPERATIONS §3): ~/orchestrator/slots, in a fake HOME. A slot is held by a
          # kernel lock for as long as its holder lives; nothing is counted by reading processes.
          fake=$(mktemp -d); slots=$fake/orchestrator/slots
          set +e; out=$(HOME=$fake scripts/agent.sh thresholds 2>&1); s=$?; set -e; [ "$s" = 4 ]; grep -qF 'slots-init' <<< "$out"   # none yet
          HOME=$fake scripts/agent.sh slots-init
          HOME=$fake scripts/agent.sh thresholds                      # all free
          # The slot names are protected: the directory is read-only, a held slot cannot be removed or
          # replaced; a missing slot file refuses (never recreated by a probe) until slots-init; an
          # unreadable one refuses as unreadable, not as held.
          [ "$(stat -c %a "$slots")" = 555 ]
          if rm -f "$slots/total-1" 2> /dev/null; [ -e "$slots/total-1" ]; then :; else echo "a slot file could be removed" >&2; exit 1; fi
          chmod 755 "$slots"; rm "$slots/total-2"; chmod 555 "$slots"
          set +e; out=$(HOME=$fake scripts/agent.sh thresholds 2>&1); s=$?; set -e; echo "$out"; [ "$s" = 4 ]; grep -qF 'is missing' <<< "$out"
          HOME=$fake scripts/agent.sh slots-init; [ -f "$slots/total-2" ]; [ "$(stat -c %a "$slots")" = 555 ]
          for x in total-1 total-3; do   # the first slot a launch would look at, and a later one
            chmod 000 "$slots/$x"
            set +e; out=$(HOME=$fake scripts/agent.sh thresholds 2>&1); s=$?; set -e; echo "$out"; [ "$s" = 4 ]; grep -qF 'unreadable' <<< "$out"
            chmod 644 "$slots/$x"
          done
          # Each holder runs in its own session (setsid does not fork here), so its pid is its process group.
          declare -A pid
          # Wait on a slot's real state, bounded, never on a fixed delay: a start or a release can be slow.
          wait_slot() { # <slot> <free|held> [seconds]
            local n=$(( ${3:-20} * 5 )) st
            for _ in $(seq 1 "$n"); do
              st=$(HOME=$fake scripts/agent.sh slots | awk -v s="$1" '$1 == s { print $2 }')
              [ "$st" = "$2" ] && return 0
              sleep 0.2
            done
            echo "slot $1 is '$st', not $2, after ${3:-20} s" >&2; return 1
          }
          run() { HOME=$fake setsid scripts/agent.sh run-in-slots "$1" "$2" "$fake/$3.log" sleep 120 & pid[$3]=$!; wait_slot "$1" held; wait_slot "$2" held; }
          refuses() { set +e; out=$(HOME=$fake scripts/agent.sh thresholds 2>&1); s=$?; set -e; echo "$out"; [ "$s" = 4 ]; grep -qF "$1" <<< "$out"; }
          # Two agents in one working directory hold two slots each (total and track), counted apart.
          run total-1 game-1 a; run total-2 game-2 b
          HOME=$fake scripts/agent.sh slots
          held=$(HOME=$fake scripts/agent.sh slots); grep -q '^total-1 *held' <<< "$held"; grep -q '^total-2 *held' <<< "$held"
          # slots-init never opens the directory while a slot is held.
          set +e; out=$(HOME=$fake scripts/agent.sh slots-init 2>&1); s=$?; set -e; echo "$out"; [ "$s" != 0 ]; grep -qF 'every slot is free' <<< "$out"
          [ "$(stat -c %a "$slots")" = 555 ]
          # The game at its cap is refused while a total slot is free.
          refuses 'the grimworld track is at its cap'
          # A slot already held cannot be taken: the inner shell refuses and runs nothing (75).
          set +e; HOME=$fake scripts/agent.sh run-in-slots total-3 game-1 "$fake/c.log" touch "$fake/ran"; s=$?; set -e
          [ "$s" = 75 ]; [ ! -e "$fake/ran" ]; grep -q '^slot-refused' "$fake/c.log.run"
          # A fourth launch is refused: three total slots held (the third by another track).
          run total-3 lib-1 c
          refuses 'the budget of 3 agents is in use'
          # A killed agent frees its slots, whatever the way it ends (SIGKILL to its process group).
          kill -9 -- -"${pid[a]}"
          wait_slot total-1 free; wait_slot game-1 free
          HOME=$fake scripts/agent.sh thresholds
          # A copy of this launcher on the library's track: its cap of 1 (lib-1 held), and the waiting marker.
          sed 's/^TRACK=grimworld$/TRACK=hexmap/' scripts/agent.sh > scripts/.agent-hexmap-ci.sh; chmod +x scripts/.agent-hexmap-ci.sh
          grep -qx 'TRACK=hexmap' scripts/.agent-hexmap-ci.sh
          set +e; out=$(HOME=$fake scripts/.agent-hexmap-ci.sh thresholds 2>&1); s=$?; set -e
          echo "$out"; [ "$s" = 4 ]; grep -qF 'the hexmap track is at its cap' <<< "$out"
          kill -9 -- -"${pid[c]}"; wait_slot total-3 free; wait_slot lib-1 free
          HOME=$fake scripts/.agent-hexmap-ci.sh thresholds
          mkdir -p "$fake/orchestrator/waiting"; touch "$fake/orchestrator/waiting/game"
          set +e; out=$(HOME=$fake scripts/.agent-hexmap-ci.sh thresholds 2>&1); s=$?; set -e
          echo "$out"; [ "$s" = 4 ]; grep -qF 'the game is waiting' <<< "$out"
          HOME=$fake scripts/agent.sh thresholds   # the marker never stops the game
          touch -d '40 minutes ago' "$fake/orchestrator/waiting/game"
          HOME=$fake scripts/.agent-hexmap-ci.sh thresholds   # a stale marker is ignored
          chmod 000 "$fake/orchestrator/waiting"   # a marker that cannot be read counts as present
          set +e; out=$(HOME=$fake scripts/.agent-hexmap-ci.sh thresholds 2>&1); s=$?; set -e
          chmod 755 "$fake/orchestrator/waiting"; echo "$out"; [ "$s" = 4 ]; grep -qF 'cannot be read' <<< "$out"
          rm -f scripts/.agent-hexmap-ci.sh
          # End to end on the detached path, with a stub codex that sleeps: the launch confirms that the agent
          # holds its two slots before it returns, status lists them, and they are free once it ends.
          for k in b; do kill -9 -- -"${pid[$k]}" 2> /dev/null || true; done; wait_slot total-2 free; wait_slot game-2 free
          # (the launcher starts codex as /usr/bin/node <codex>: the stub is a node script that waits for $fake/release)
          # GitHub's runner has node elsewhere: link it where the launcher expects it (the runner allows sudo).
          if [ ! -x /usr/bin/node ] && command -v node > /dev/null; then sudo ln -s "$(command -v node)" /usr/bin/node; fi
          if [ -x /usr/bin/node ]; then
            rm -f .claude/worktrees/logs/slottest.*   # this fixture's own record, from an earlier run
            mkdir -p "$fake/bin" .claude/worktrees/cli-slottest
            # the stub lives until the fixture releases it, so the held check cannot race its exit
            printf 'import("node:fs").then((fs) => { const f = process.env.HOME + "/release"; const t = setInterval(() => { if (fs.existsSync(f)) clearInterval(t); }, 200); });\n' > "$fake/bin/codex"; chmod +x "$fake/bin/codex"
            out=$(HOME=$fake PATH="$fake/bin:$PATH" scripts/agent.sh slottest codex gpt-6-sol new "x" audit 2>&1)
            echo "$out"; grep -qF 'slottest: holds slots total-1 and game-1' <<< "$out"
            st=$(HOME=$fake scripts/agent.sh status); grep -q '^slot total-1 held slottest' <<< "$st"
            touch "$fake/release"; wait_slot total-1 free 60; wait_slot game-1 free 60   # released: it ends, the slots free
          else
            echo "end-to-end slot fixture skipped: no /usr/bin/node on this runner"
          fi
          # The launch lock: while another launcher holds it, a launch waits (killed by timeout: 124);
          # once released, the same launch goes on to the slots, which refuse (4). Nothing is launched.
          run total-1 game-1 d; run total-2 game-2 f; run total-3 lib-1 e   # the budget full again
          flock "$fake/orchestrator/agent-launch.lock" sleep 6 & holder=$!
          for _ in $(seq 1 50); do flock -n "$fake/orchestrator/agent-launch.lock" true || break; sleep 0.2; done   # held
          set +e; HOME=$fake timeout 3 scripts/agent.sh locktest claude opus new "x" research; s=$?; set -e
          [ "$s" = 124 ]; wait "$holder"
          set +e; HOME=$fake scripts/agent.sh locktest claude opus new "x" research; s=$?; set -e; [ "$s" = 4 ]
          for k in d e f; do kill -9 -- -"${pid[$k]}" 2> /dev/null || true; done
          # The build lock wraps build and test subcommands only.
          for bad in "rm -rf x" "--heavy pnpm exec sh" "pnpm dlx x" "scarb run x" "sozo execute x" "snforge"; do
            if scripts/lock.sh $bad 2> /dev/null; then echo "lock.sh accepted: $bad" >&2; exit 1; fi
          done
          # Under the heavy lock without the project lock, the order would be reversed: refused.
          if HEAVY_BUILD_LOCK_HELD=1 scripts/lock.sh scarb build 2> /dev/null; then
            echo "lock.sh accepted a reversed lock order" >&2; exit 1
          fi
          # --wait (FND-13): a lock that stays busy ends the wait with 75 and the busy line, and the command
          # does not run (a fake scarb records any run); the same for the heavy lock; a bad number is refused.
          lkd=$(mktemp -d); mkdir "$lkd/bin"
          printf '#!/bin/sh\ntouch "%s/ran"\n' "$lkd" > "$lkd/bin/scarb"; chmod +x "$lkd/bin/scarb"
          export GRIMWORLD_BUILD_LOCK=$lkd/project.lock HEAVY_BUILD_LOCK=$lkd/heavy.lock
          flock "$GRIMWORLD_BUILD_LOCK" sleep 4 & lk1=$!
          for _ in $(seq 1 50); do flock -n "$GRIMWORLD_BUILD_LOCK" true || break; sleep 0.2; done   # held
          set +e; out=$(PATH=$lkd/bin:$PATH scripts/lock.sh --wait 1 scarb build 2>&1); s=$?; set -e
          [ "$s" = 75 ]; grep -q 'build lock busy for 1 s' <<< "$out"; [ ! -e "$lkd/ran" ]
          wait "$lk1"
          flock "$HEAVY_BUILD_LOCK" sleep 4 & lk2=$!
          for _ in $(seq 1 50); do flock -n "$HEAVY_BUILD_LOCK" true || break; sleep 0.2; done   # held
          set +e; out=$(PATH=$lkd/bin:$PATH scripts/lock.sh --heavy --wait 1 scarb build 2>&1); s=$?; set -e
          [ "$s" = 75 ]; grep -q 'build lock busy for 1 s' <<< "$out"; [ ! -e "$lkd/ran" ]
          wait "$lk2"
          # FND-15: the heavy lock is taken for a scarb build wherever the subcommand sits, with no --heavy: after
          # --manifest-path too (the machine shim only sees a first-argument subcommand). Held, it ends in 75 and the
          # command does not run; `scarb fmt` takes no heavy lock and runs under the same held lock.
          flock "$HEAVY_BUILD_LOCK" sleep 6 & lk3=$!
          for _ in $(seq 1 50); do flock -n "$HEAVY_BUILD_LOCK" true || break; sleep 0.2; done   # held
          set +e; out=$(PATH=$lkd/bin:$PATH scripts/lock.sh --wait 1 scarb --manifest-path x/Scarb.toml build 2>&1); s=$?; set -e
          [ "$s" = 75 ]; grep -q 'build lock busy for 1 s' <<< "$out"; [ ! -e "$lkd/ran" ]
          set +e; out=$(PATH=$lkd/bin:$PATH scripts/lock.sh --wait 1 scarb build 2>&1); s=$?; set -e
          [ "$s" = 75 ]; [ ! -e "$lkd/ran" ]
          PATH=$lkd/bin:$PATH scripts/lock.sh --wait 1 scarb fmt --check; [ -e "$lkd/ran" ]; rm -f "$lkd/ran"
          PATH=$lkd/bin:$PATH scripts/lock.sh --wait 1 scarb --manifest-path x/Scarb.toml fmt --check; [ -e "$lkd/ran" ]; rm -f "$lkd/ran"
          wait "$lk3"
          # Free again: the command runs under the locks.
          PATH=$lkd/bin:$PATH scripts/lock.sh --heavy --wait 5 scarb build; [ -e "$lkd/ran" ]
          for w in 0 x; do
            set +e; PATH=$lkd/bin:$PATH scripts/lock.sh --wait "$w" scarb build 2> /dev/null; s=$?; set -e
            [ "$s" = 2 ] || { echo "lock.sh --wait $w: exit $s, not refused" >&2; exit 1; }
          done
          unset GRIMWORLD_BUILD_LOCK HEAVY_BUILD_LOCK

      # with-node.sh (FND-09): the process group of the command on both paths (with setsid, and with it hidden from
      # PATH so the perl fallback of macOS runs), and --full-archive. The node is the pinned devnet, downloaded
      # from its release and checked against the sha256 of setup-toolchain.sh before it is run.
      - name: with-node
        run: |
          set -euo pipefail
          if ! command -v starknet-devnet > /dev/null; then
            want=$(sed -n 's/^ *starknet-devnet:0.10.0:amd64) echo \([0-9a-f]*\) ;;$/\1/p' scripts/setup-toolchain.sh)
            [ -n "$want" ]
            dl=$(mktemp -d)
            curl -sfL --retry 3 --retry-delay 5 "https://github.com/0xSpaceShard/starknet-devnet/releases/download/v0.10.0/starknet-devnet-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$dl"
            bin=$(find "$dl" -type f -name starknet-devnet | head -n 1)
            [ "$(sha256sum "$bin" | cut -d' ' -f1)" = "$want" ]
            chmod +x "$bin"; export PATH="$(dirname "$bin"):$PATH"
          fi
          starknet-devnet --version
          work=$(mktemp -d); export WITH_NODE_LOG_DIR=$work/log

          # A PATH without setsid: every PATH directory that holds it is replaced by a directory of links to
          # its other files (perl and the rest stay).
          nosetsid=''; n=0
          IFS=: read -ra dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            if [ -x "$d/setsid" ]; then
              n=$((n + 1)); mkdir -p "$work/nosetsid$n"
              for f in "$d"/*; do [ "${f##*/}" = setsid ] || ln -s "$f" "$work/nosetsid$n/" 2> /dev/null || true; done
              d=$work/nosetsid$n
            fi
            nosetsid=$nosetsid:$d
          done
          nosetsid=${nosetsid#:}
          if PATH=$nosetsid command -v setsid; then echo "setsid still visible" >&2; exit 1; fi

          alive() { kill -0 "$1" 2> /dev/null; }
          gone() { for _ in $(seq 1 60); do alive "$1" || return 0; sleep 0.2; done; echo "pid $1 still alive" >&2; return 1; }
          port_dead() { for _ in $(seq 1 60); do curl -s -m 1 -o /dev/null "$1" || return 0; sleep 0.2; done; echo "$1 still answers" >&2; return 1; }
          pgid_of() { ps -o pgid= -p "$1" | tr -d ' '; }

          # One run of the four cases with the PATH given: group, exit, signal, timeout.
          cases() { # <label> <PATH>
            local label=$1 path=$2 rc wn child url pid pgid
            # 1. its own group, apart from the script's group; the node is stopped
            rm -f "$work/g"
            PATH=$path scripts/with-node.sh sh -c 'echo "$$ $(ps -o pgid= -p $$ | tr -d " ") $NODE_URL" > "$1"' sh "$work/g"
            read -r pid pgid url < "$work/g"
            [ "$pid" = "$pgid" ]; [ "$pgid" != "$(pgid_of $$)" ]
            port_dead "$url"
            # 2. on exit: the command's status, and a child it left behind is stopped with the group
            rm -f "$work/c"
            set +e; PATH=$path scripts/with-node.sh sh -c 'sleep 300 & echo $! > "$1"; exit 3' sh "$work/c"; rc=$?; set -e
            [ "$rc" = 3 ]; gone "$(cat "$work/c")"
            # 3. on a signal: the command's child and the node go, the status is 143
            rm -f "$work/s"
            PATH=$path scripts/with-node.sh sh -c 'sleep 300 & echo "$! $NODE_URL" > "$1"; wait' sh "$work/s" &
            wn=$!
            for _ in $(seq 1 100); do [ -s "$work/s" ] && break; sleep 0.2; done
            read -r child url < "$work/s"
            kill -TERM "$wn"
            set +e; wait "$wn"; rc=$?; set -e
            [ "$rc" = 143 ]; gone "$child"; port_dead "$url"
            # 4. on a timeout
            rm -f "$work/t"
            set +e; PATH=$path timeout 25 scripts/with-node.sh sh -c 'sleep 300 & echo "$! $NODE_URL" > "$1"; wait' sh "$work/t"; rc=$?; set -e
            [ "$rc" = 124 ]
            read -r child url < "$work/t"; gone "$child"; port_dead "$url"
            echo "with-node cases ok: $label"
          }
          cases "setsid" "$PATH"
          cases "no setsid (perl fallback)" "$nosetsid"
          # a command that does not exist stops with 127 on the fallback path too
          set +e; PATH=$nosetsid scripts/with-node.sh no-such-command-fnd09 2> "$work/err"; rc=$?; set -e
          [ "$rc" = 127 ]; grep -q 'no-such-command-fnd09' "$work/err"
          # setsid(2) itself failing stops with 127 and the command does not run. Linux refuses setsid(2) (EPERM) to
          # a group leader that has another member in its group: a wrapper makes perl one, with a short-lived child.
          mkdir -p "$work/leader"; realperl=$(command -v perl)
          printf '#!/bin/sh\nexec %s -e '"'"'use POSIX (); defined(POSIX::setpgid(0, 0)) or die "setpgid: $!"; fork() or exec "sleep", "5"; exec { $ARGV[0] } @ARGV'"'"' -- %s "$@"\n' "$realperl" "$realperl" > "$work/leader/perl"
          chmod +x "$work/leader/perl"; rm -f "$work/ran"
          set +e; PATH=$work/leader:$nosetsid scripts/with-node.sh touch "$work/ran" 2> "$work/err"; rc=$?; set -e
          cat "$work/err"; [ "$rc" = 127 ]; grep -q 'setsid: ' "$work/err"; [ ! -e "$work/ran" ]
          # neither setsid nor perl: refused before any node is started
          mkdir -p "$work/bare"; ln -sf "$(command -v bash)" "$work/bare/bash"; ln -sf "$(command -v starknet-devnet)" "$work/bare/starknet-devnet"
          set +e; PATH=$work/bare "$work/bare/bash" scripts/with-node.sh true 2> "$work/err"; rc=$?; set -e
          [ "$rc" = 127 ]; grep -q 'neither setsid nor perl' "$work/err"

          # The asdf fallback (FND-14): starknet-devnet is not on the PATH but asdf is. A stub asdf answers
          # `where starknet-devnet 0.10.0` (the version of .tool-versions) with a directory whose bin/ holds the
          # downloaded devnet, and the node starts from it; with a wrong directory, or no asdf, it stops with 127.
          realdevnet=$(command -v starknet-devnet)
          nodevnet=''; n=0
          IFS=: read -ra dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            if [ -x "$d/starknet-devnet" ]; then
              n=$((n + 1)); mkdir -p "$work/nodevnet$n"
              for f in "$d"/*; do [ "${f##*/}" = starknet-devnet ] || ln -s "$f" "$work/nodevnet$n/" 2> /dev/null || true; done
              d=$work/nodevnet$n
            fi
            nodevnet=$nodevnet:$d
          done
          nodevnet=${nodevnet#:}
          if PATH=$nodevnet command -v starknet-devnet; then echo "starknet-devnet still visible" >&2; exit 1; fi
          mkdir -p "$work/asdf-home/bin" "$work/asdf-bin"; ln -sf "$realdevnet" "$work/asdf-home/bin/starknet-devnet"
          # shellcheck disable=SC2016 # the stub's own variables, not this shell's
          printf '#!/bin/sh\necho "$*" >> "%s/asdf-calls"\n[ "$1 $2 $3" = "where starknet-devnet 0.10.0" ] && echo "%s"\n' "$work" "$work/asdf-home" > "$work/asdf-bin/asdf"
          chmod +x "$work/asdf-bin/asdf"
          grep -qx 'starknet-devnet 0.10.0' .tool-versions
          rm -f "$work/asdf-calls" "$work/asdf-url"
          # shellcheck disable=SC2016 # the inner shell expands NODE_URL, on purpose
          PATH=$work/asdf-bin:$nodevnet scripts/with-node.sh sh -c 'echo "$NODE_URL" > "$1"' sh "$work/asdf-url"
          grep -q '^http://127.0.0.1:' "$work/asdf-url"; grep -qx 'where starknet-devnet 0.10.0' "$work/asdf-calls"
          rm -f "$work/ran"; printf '#!/bin/sh\necho "%s/nowhere"\n' "$work" > "$work/asdf-bin/asdf"
          set +e; PATH=$work/asdf-bin:$nodevnet scripts/with-node.sh touch "$work/ran" 2> "$work/err"; rc=$?; set -e
          [ "$rc" = 127 ]; grep -q 'starknet-devnet not found' "$work/err"; [ ! -e "$work/ran" ]

          # --full-archive: the flag is on the node's command line, and a balance read at block 0 answers
          # after a mint made a later block; without the flag the same read is refused.
          cat > "$work/archive.sh" <<'EOS'
          set -euo pipefail
          rpc() { curl -sf -X POST -H 'content-type: application/json' -d "$1" "$NODE_URL"; }
          port=${NODE_URL##*:}
          args=$(ps -eo args= -ww | grep -F -- "--port $port" | grep -v grep || true)
          echo "node: $args"
          if [ "$1" = full ]; then grep -qF -- '--state-archive-capacity full' <<< "$args"; else ! grep -qF -- 'state-archive' <<< "$args"; fi
          rpc "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"devnet_mint\",\"params\":{\"address\":\"$NODE_ACCOUNT_ADDRESS\",\"amount\":1000,\"unit\":\"FRI\"}}" > /dev/null
          strk=0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d
          bal() { rpc "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"starknet_call\",\"params\":{\"request\":{\"contract_address\":\"$strk\",\"entry_point_selector\":\"0x2e4263afad30923c891518314c3c95dbe830a16874e8abc5777a9a20b54c76e\",\"calldata\":[\"$NODE_ACCOUNT_ADDRESS\"]},\"block_id\":$1}}" || true; }
          old=$(bal '{"block_number":0}'); now=$(bal '"latest"')
          echo "block 0: $old"; echo "latest: $now"
          grep -q '"result"' <<< "$now"
          if [ "$1" = full ]; then grep -q '"result"' <<< "$old"; [ "$old" != "$now" ]; else ! grep -q '"result"' <<< "$old"; fi
          EOS
          scripts/with-node.sh --full-archive bash "$work/archive.sh" full
          scripts/with-node.sh bash "$work/archive.sh" none

      - name: no asset file committed (D-73)
        run: |
          set -euo pipefail
          exts='png|jpe?g|gif|webp|bmp|tga|psd|aseprite|ase|kra|svg|wav|ogg|mp3|flac|ttf|otf|woff2?|fnt'
          files=$(git ls-files | grep -iE "\.($exts)\$" || true)
          # A sprite atlas descriptor (TexturePacker-style JSON) is derived from the pack too.
          atlases=$(git ls-files -z '*.json' | xargs -0 -r grep -lE '"frames"[[:space:]]*:' |
            xargs -r grep -lE '"image"[[:space:]]*:' || true)
          if [ -n "$files$atlases" ]; then
            echo "Image, audio, font or atlas files are not allowed in this repository (D-73):" >&2
            echo "$files $atlases" >&2
            exit 1
          fi

      # No pull request moves the submodule pointer: a branch name or a label would prove nothing,
      # since agents create both. The orchestrator moves it by its own commit on main (OPERATIONS §7).
      - name: assets pointer unchanged (D-73)
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          base=$(git ls-tree FETCH_HEAD assets | awk '{print $3}')
          head=$(git ls-tree HEAD assets | awk '{print $3}')
          if [ "$base" != "$head" ]; then
            echo "The assets submodule pointer moved ($base -> $head)." >&2
            exit 1
          fi
